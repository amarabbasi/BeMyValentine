<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️ Be My Valentine? ❤️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kalam&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/Heart_corazon.svg.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Personal Message -->
    <div class="personal-message">
        <p>Hey Mariam, it's your favorite boy back again to ask his lovely woman once more. ❤️</p>
    </div>

    <h1 class="question">Will you be my Valentine? <3</h1>
    <img src="assets/heart.gif" alt="Heart GIF" width="300px" height="300px" class="giffy">

    <div class="buttons">
        <button class="button yes" onclick="yes()">Yes</button>
        <button class="button no" onclick="no()">No</button>
    </div>

    <h1 class="text">I love you</h1>
    <script src="script.js"></script>
</body>
</html>
